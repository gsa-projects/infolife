<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count People-사진을 업로드하세요!</title>
</head>
<body>
    <h2>Count People in your photo</h2>
    <p>"Choose File" 버튼으로 파일을 선택하고 "Upload" 버튼으로 업로드 하세요. <br>JPG, JPEG, PNG 파일만 가능합니다.</p>

    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <br><br>
        <button type="submit">Upload</button>
    </form>
    <p>파일을 업로드 하면 인공지능을 활용하여 인원수를 센 후 사진에 글자와 함께 표시됩니다.</p>
    <p>또한 셌던 사람의 수를 사각형으로 표시해 줍니다.</p>
    <p></p>
    <p>여기 예시가 있습니다.</p>
    <img src="/static/images/The_Solvay_Conference,_1927.jpg" width="650">
    <p>다음과 같은 사진을 업로드하면</p>
    <img src="/static/results/result_of_The_Solvay_Conference,_1927.jpg" width="650">
    <p>다음과 같이 결과물이 나옵니다.</p>
</body>
</html>
